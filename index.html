<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strafe Trainer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--fg:#e8eef5;--acc:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0b0f14;color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;pointer-events:none}
#hud div{flex:1;background:rgba(0,0,0,.45);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:#9db8d8}
#hud b{display:block;font-size:18px;color:var(--fg)}
#sensBox{position:absolute;left:14px;bottom:30px;font-size:11px;color:#9db8d8;width:42%}
#sensBox input{width:100%;touch-action:pan-x}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,12,.8);padding:20px;box-sizing:border-box}
#panel{max-width:340px;width:100%;background:#131a22;border:1px solid #243242;border-radius:16px;padding:22px;text-align:center}
#panel h1{margin:0 0 8px;font-size:22px}
#panel p{margin:6px 0;color:#9db8d8;font-size:14px;line-height:1.4}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
#stats div{background:#0b0f14;border-radius:10px;padding:8px;font-size:12px;color:#9db8d8}
#stats b{display:block;font-size:22px;color:var(--fg)}
#seg{display:flex;gap:6px;margin:12px 0 4px}
#seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid #243242;background:#0b0f14;color:#9db8d8;font-weight:700;font-size:14px}
#seg button.on{background:#1f3a2a;border-color:var(--acc);color:var(--fg)}
#go{margin-top:10px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#06210f;font-size:16px;font-weight:800}
</style></head>
<body><div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><div>HP<b id="hp">100</b></div><div>HITS<b id="h">0</b></div><div>MISSES<b id="m">0</b></div><div>ACCURACY<b id="ac">--</b></div></div>
<div id="sensBox">Sensitivity<input id="sens" type="range" min="0.1" max="0.7" step="0.01" value="0.3"></div>
<div id="ov"><div id="panel">
<h1 id="t">Strafe Trainer</h1>
<p id="d">Swipe left/right to turn a full 360°. Tap the target to shoot it. The target strafes and dodges around you, so check behind you too. Red arrow = which way to turn.</p>
<div id="seg"><button data-d="easy">Easy</button><button data-d="medium">Medium</button><button data-d="hard">Hard</button></div>
<p id="dd"></p>
<div id="stats" style="display:none"></div>
<button id="go">Start</button>
</div></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H;
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

const FOV=100,HW=5,DMG=20;
const norm=a=>((a%360)+540)%360-180;
let yaw=0,sens=.3,state='ready',hits=0,misses=0,t0=0,tEnd=0;
let T={a:150,v:0,tv:0,hp:100,next:0,flash:0,d:1,jt:0,jdur:.35};
const rnd=(a,b)=>a+Math.random()*(b-a);
const CFG={
 easy:{spd:[28,50],int:[.9,2],pause:.1,acc:300,depth:false,jump:false,desc:'Simple left/right strafing at a slow pace.'},
 medium:{spd:[55,115],int:[.3,1],pause:.1,acc:800,depth:true,dr:[.6,1.5],dsp:[.3,.9],jump:false,desc:'Faster. Changes direction randomly, and moves toward/away from you so its size changes. Infinite reach.'},
 hard:{spd:[90,190],int:[.12,.5],pause:.15,acc:1800,depth:true,dr:[.5,1.8],dsp:[.5,1.5],jump:true,jint:[.8,2.2],jd:[25,55],desc:'Fast and unpredictable, and it leaps sideways to dodge.'}
};
let diff='easy';
function setDiff(d){diff=d;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));$('dd').textContent=CFG[d].desc}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setDiff(b.dataset.d));
$('sens').oninput=e=>sens=+e.target.value;
setDiff('easy');

function reset(){
  yaw=0;hits=0;misses=0;
  T={a:(Math.random()<.5?-1:1)*(90+Math.random()*90),v:0,tv:0,hp:100,next:0,flash:0,d:1,dv:0,dtv:0,dn:0,jn:rnd(.8,2),jt:0,jdur:.35,jv:0};
  t0=performance.now();state='play';$('ov').style.display='none';
}
$('go').onclick=reset;

const marks=[];
function shoot(px,py){
  if(state!=='play')return;
  const ppd=W/FOV,dx=norm(T.a-yaw),x=W/2+dx*ppd;
  const hit=Math.abs(dx)<=FOV/2+10&&Math.abs(px-x)<HW*ppd/T.d+8;
  marks.push({x:px,y:py,c:hit?'#4ade80':'#f87171',l:.35});
  if(hit){
    hits++;T.hp-=DMG;T.flash=.12;
    navigator.vibrate&&navigator.vibrate(12);
    if(T.hp<=0){T.hp=0;die()}
  }else misses++;
}
function die(){
  state='dead';tEnd=performance.now();
  const tot=hits+misses,acc=tot?(hits/tot*100).toFixed(1)+'%':'--';
  $('t').textContent='Target down · '+diff[0].toUpperCase()+diff.slice(1);
  $('d').textContent='';
  const s=$('stats');s.style.display='grid';
  s.innerHTML=`<div>HITS<b>${hits}</b></div><div>MISSES<b>${misses}</b></div><div>ACCURACY<b>${acc}</b></div><div>TIME<b>${((tEnd-t0)/1000).toFixed(1)}s</b></div>`;
  $('go').textContent='Play again';
  setTimeout(()=>{if(state==='dead')$('ov').style.display='flex'},700);
}

// input: drag to turn, tap to shoot
const ptr=new Map();
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  cv.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId,{x:e.clientX,t:performance.now(),moved:0});
});
cv.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x;p.x=e.clientX;p.moved+=Math.abs(dx);
  yaw=norm(yaw+dx*sens);
});
const up=e=>{
  const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);
  if(e.type==='pointerup'&&p.moved<12&&performance.now()-p.t<300){const b=cv.getBoundingClientRect();shoot(e.clientX-b.left,e.clientY-b.top)}
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function update(dt){
  for(let i=marks.length-1;i>=0;i--){marks[i].l-=dt;if(marks[i].l<=0)marks.splice(i,1)}
  if(state!=='play')return;
  const C=CFG[diff];
  if(T.flash>0)T.flash-=dt;
  if(T.jt>0){
    T.jt-=dt;T.a=norm(T.a+T.jv*dt);
    if(T.jt<=0){T.v=T.jv*.3;T.tv=T.v;T.next=rnd(...C.int)}
  }else{
    T.next-=dt;
    if(T.next<=0){
      T.next=rnd(...C.int);
      const d=Math.random()<.5?-1:1;
      T.tv=Math.random()<C.pause?0:d*rnd(...C.spd);
    }
    const ac=C.acc*dt;
    T.v+=Math.max(-ac,Math.min(ac,T.tv-T.v));
    T.a=norm(T.a+T.v*dt);
    if(C.jump){
      T.jn-=dt;
      if(T.jn<=0){T.jn=rnd(...C.jint);T.jt=T.jdur=.35;T.jv=(Math.random()<.5?-1:1)*rnd(...C.jd)/.35}
    }
  }
  if(C.depth){
    T.dn-=dt;
    if(T.dn<=0){T.dn=rnd(.4,1.2);T.dtv=Math.random()<.2?0:(Math.random()<.5?-1:1)*rnd(...C.dsp)}
    const da=3*dt;
    T.dv+=Math.max(-da,Math.min(da,T.dtv-T.dv));
    T.d+=T.dv*dt;
    if(T.d<C.dr[0]){T.d=C.dr[0];T.dtv=Math.abs(T.dtv);T.dv=Math.abs(T.dv)}
    if(T.d>C.dr[1]){T.d=C.dr[1];T.dtv=-Math.abs(T.dtv);T.dv=-Math.abs(T.dv)}
  }
}

function draw(){
  const hy=H*.55,ppd=W/FOV;
  let g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#0d1b2e');g.addColorStop(1,'#25456b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hy);
  g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,'#1d2a1f');g.addColorStop(1,'#0c130e');
  ctx.fillStyle=g;ctx.fillRect(0,hy,W,H-hy);
  ctx.textAlign='center';
  for(let a=-180;a<180;a+=15){
    const dx=norm(a-yaw);if(Math.abs(dx)>FOV/2+6)continue;
    const x=W/2+dx*ppd,big=a%90===0,h=big?H*.3:H*.12,w=big?14:8;
    ctx.fillStyle=big?'#3b5b84':'#2a4261';ctx.fillRect(x-w/2,hy-h,w,h);
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(x,hy);ctx.lineTo(W/2+(x-W/2)*2.6,H);ctx.stroke();
    if(big){ctx.fillStyle='#9db8d8';ctx.font='bold 14px system-ui';ctx.fillText(a===0?'N':a===90?'E':a===-90?'W':'S',x,hy-h-6)}
  }
  // target
  if(T.hp>0){
    const dx=norm(T.a-yaw),k=1/T.d;
    if(Math.abs(dx)<=FOV/2+10){
      const x=W/2+dx*ppd,bw=2*HW*ppd*k,bh=bw*2.4,base=hy+H*.08*k,
        hop=T.jt>0?Math.sin(Math.PI*(1-T.jt/T.jdur))*H*.1*k:0,feet=base-hop,hr=bw*.28;
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,base,bw*.6,bw*.15,0,0,7);ctx.fill();
      ctx.fillStyle=T.flash>0?'#fff':'#ef4444';
      ctx.fillRect(x-bw/2,feet-bh+hr*2+2,bw,bh-hr*2-2);
      ctx.beginPath();ctx.arc(x,feet-bh+hr,hr,0,7);ctx.fill();
      const bwid=Math.max(50,bw*1.4),by=feet-bh-14;
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-bwid/2,by,bwid,6);
      ctx.fillStyle='#4ade80';ctx.fillRect(x-bwid/2,by,bwid*T.hp/100,6);
    }
    if(Math.abs(dx)>FOV/2&&state==='play'){
      const r=dx>0,e=r?W-10:10,i=r?W-34:34;
      ctx.fillStyle='#f87171';ctx.beginPath();ctx.moveTo(e,H/2);ctx.lineTo(i,H/2-16);ctx.lineTo(i,H/2+16);ctx.fill();
    }
  }
  // tap markers
  ctx.lineWidth=2;
  for(const m of marks){ctx.globalAlpha=Math.max(0,m.l/.35);ctx.strokeStyle=m.c;ctx.beginPath();ctx.arc(m.x,m.y,8+(.35-m.l)*60,0,7);ctx.stroke()}
  ctx.globalAlpha=1;
}

function hud(){
  $('hp').textContent=T.hp;$('h').textContent=hits;$('m').textContent=misses;
  const tot=hits+misses;$('ac').textContent=tot?Math.round(hits/tot*100)+'%':'--';
}
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  update(dt);draw();hud();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
